<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godot Browser Export Placeholder</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0b1220;
        color: #e5e7eb;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 1rem;
        padding: 2rem;
        max-width: 600px;
        text-align: center;
      }
      a {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Godot HTML5 Export Placeholder</h1>
      <p>
        This page is the browser entry-point for the Godot game.
        Export your Godot project to <code>frontend/public/game/</code> and replace this file with the actual Godot HTML5 export.
      </p>
      <p>
        After export, open <a href="/game/index.html">/game/index.html</a> in your browser to play the game.
      </p>
      <p>
        <a href="/">Back to React dashboard</a>
      </p>
    </div>
  </body>
</html>
